name: Refresh plots

on:
  push:
    branches: [refresh-three-panel-outputs]
    paths: [.github/workflows/refresh-plots.yml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python run.py --ratio 4 --backend skimage
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/plots/*.png results/pipeline.png
          if ! git diff --cached --quiet; then
            git commit -m "Update three-panel stage plots"
            git push
          fi
